# [rime-japanese/japanese.schema.yaml at master · gkovacs/rime-japanese]( https://github.com/gkovacs/rime-japanese/blob/master/japanese.schema.yaml )
# Rime schema

# encoding: utf-8

schema:
  schema_id: japanese
  name: 日本語
  version: "v0.2"
  author:
    - ensigma96 <ensigma96@gmail.com>
  dependencies:
    - terra_pinyin.extended # for using reverse lookup
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@putonghua_to_kanji_lookup
    - affix_segmentor@hannom_lookup
    - affix_segmentor@hanja_lookup
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - script_translator@putonghua_to_kanji_lookup
    - script_translator@hannom_lookup
    - script_translator@hanja_lookup
  filters:
    - simplifier
    #- simplifier@jp_variants
    #- simplifier@zh_simp
    #- simplifier@zh_tw
    - uniquifier
    - reverse_lookup_filter@putonghua_to_kanji_reverse_lookup
    - reverse_lookup_filter@hannom_reverse_lookup
    - reverse_lookup_filter@hanja_reverse_lookup

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba-_"
  delimiter: " '"
  algebra:
    - "derive/_/x/"
    - "derive/_/l/"
    - "derive/-/q/"
    # Add / remove rules the as you wish
    - "derive/i_e/ye/"
    # - 'derive/fu/hu/'

translator:
  dictionary: japanese
  spelling_hints: 5
  comment_format:
    - "xlit|q|ー|"
    - "xlit|-|ー|"
  preedit_format:
    - "xlit|q|ー|"
    - "xlit|-|ー|"

# simplifier:
#  option_name: jp_variants
#  opencc_config: jp_t2s.json

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`H"
  suffix: "`"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - "xlit|q|ー|"

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { accept: "Control+Shift+1", select: .next, when: always }
    - { accept: "Control+Shift+n", select: japanese, when: always }
    - { accept: "Control+Shift+N", select: japanese, when: always }
    - { accept: "Control+Shift+j", select: double_jyutping_extra, when: always }
    - { accept: "Control+Shift+J", select: double_jyutping_extra, when: always }
    - { accept: "Control+Shift+m", select: td_pinyin_flypy_extra, when: always }
    - { accept: "Control+Shift+M", select: td_pinyin_flypy_extra, when: always }
    - { accept: "Control+Shift+l", select: international, when: always }
    - { accept: "Control+Shift+L", select: international, when: always }
    - { accept: "F16", select: .next, when: always }
    - { accept: "F19", select: international, when: always }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`H[a-z]*`?$"
    putonghua_to_kanji_lookup: "`[a-z;/,.]*`?$"
    hannom_lookup: "`V[a-z]*?$"
    hanja_lookup: "`K[a-z]*?$"
